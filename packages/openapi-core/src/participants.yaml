openapi: 3.1.0
info:
  title: Participants API (Identity TCR)
  version: 0.1.0
  description: Sybil-costly participant registry / token-curated registry for reward roles.
  license: { name: Proprietary, url: https://veridrop.local/license }
  x-domain: ptc
servers:
  - url: https://api.veridrop.local
security:
  - apiKey: []
tags:
  - name: Participants
paths:
  /v0/participants:
    get:
      operationId: listParticipants
      tags: [Participants]
      summary: List participants
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: tcrStatus
          in: query
          schema: { $ref: ./participants.schemas.yaml#/components/schemas/TcrStatus }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantListResponse }
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: applyParticipant
      tags: [Participants]
      summary: Apply to the identity TCR
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantApplyRequest }
      responses:
        '201':
          description: Applied
          content:
            application/json:
              schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantResponse }
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: Participant
      x-dynamodb:
        entityType: "PARTICIPANT"
        pkPatternTemplate: "PARTICIPANT#${participantId}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
  /v0/participants/{participantId}:
    parameters:
      - name: participantId
        in: path
        required: true
        schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantId }
    get:
      operationId: getParticipant
      tags: [Participants]
      summary: Get participant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantResponse }
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v0/participants/{participantId}/challenge:
    parameters:
      - name: participantId
        in: path
        required: true
        schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantId }
    post:
      operationId: challengeParticipant
      tags: [Participants]
      summary: Challenge a TCR listing
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./participants.schemas.yaml#/components/schemas/ChallengeParticipantRequest }
      responses:
        '200':
          description: Challenged
          content:
            application/json:
              schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantResponse }
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: none
  /v0/participants/{participantId}/approve-role:
    parameters:
      - name: participantId
        in: path
        required: true
        schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantId }
    post:
      operationId: approveParticipantRole
      tags: [Participants]
      summary: Approve role eligibility after TCR listing
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./participants.schemas.yaml#/components/schemas/ApproveRoleRequest }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantResponse }
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: none
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
