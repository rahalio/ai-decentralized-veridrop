openapi: 3.1.0
info:
  title: Delivery Proofs API
  version: 0.1.0
  description: Cryptographic delivery attestations. Payloads never stored; digests only.
  license: { name: Proprietary, url: https://veridrop.local/license }
  x-domain: prf
servers:
  - url: https://api.veridrop.local
security:
  - apiKey: []
tags:
  - name: DeliveryProofs
paths:
  /v0/delivery-proofs:
    get:
      operationId: listDeliveryProofs
      tags: [DeliveryProofs]
      summary: List delivery proofs (inbox)
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: verdict
          in: query
          schema: { $ref: ./proofs.schemas.yaml#/components/schemas/ProofVerdict }
        - name: serviceId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: ./proofs.schemas.yaml#/components/schemas/DeliveryProofListResponse }
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: submitDeliveryProof
      tags: [DeliveryProofs]
      summary: Submit a delivery proof digest
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./proofs.schemas.yaml#/components/schemas/DeliveryProofCreateRequest }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: ./proofs.schemas.yaml#/components/schemas/DeliveryProofResponse }
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: DeliveryProof
      x-dynamodb:
        entityType: "DELIVERY_PROOF"
        pkPatternTemplate: "DELIVERY_PROOF#${proofId}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
  /v0/delivery-proofs/{proofId}:
    parameters:
      - name: proofId
        in: path
        required: true
        schema: { $ref: ./proofs.schemas.yaml#/components/schemas/ProofId }
    get:
      operationId: getDeliveryProof
      tags: [DeliveryProofs]
      summary: Get delivery proof
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: ./proofs.schemas.yaml#/components/schemas/DeliveryProofResponse }
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v0/delivery-proofs/{proofId}/accept:
    parameters:
      - name: proofId
        in: path
        required: true
        schema: { $ref: ./proofs.schemas.yaml#/components/schemas/ProofId }
    post:
      operationId: acceptDeliveryProof
      tags: [DeliveryProofs]
      summary: Accept a delivery proof
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: ./proofs.schemas.yaml#/components/schemas/DeliveryProofResponse }
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: none
  /v0/delivery-proofs/{proofId}/reject:
    parameters:
      - name: proofId
        in: path
        required: true
        schema: { $ref: ./proofs.schemas.yaml#/components/schemas/ProofId }
    post:
      operationId: rejectDeliveryProof
      tags: [DeliveryProofs]
      summary: Reject a delivery proof with reason
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./proofs.schemas.yaml#/components/schemas/ProofRejectRequest }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: ./proofs.schemas.yaml#/components/schemas/DeliveryProofResponse }
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: none
  /v0/delivery-proofs/{proofId}/slash:
    parameters:
      - name: proofId
        in: path
        required: true
        schema: { $ref: ./proofs.schemas.yaml#/components/schemas/ProofId }
    post:
      operationId: slashDeliveryProof
      tags: [DeliveryProofs]
      summary: Slash linked stake with reason
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./proofs.schemas.yaml#/components/schemas/ProofSlashRequest }
      responses:
        '200':
          description: Slashed
          content:
            application/json:
              schema: { $ref: ./proofs.schemas.yaml#/components/schemas/DeliveryProofResponse }
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: none
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
