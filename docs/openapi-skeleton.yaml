openapi: 3.0.3
info:
  title: Veridrop
  version: 0.1.0
  description: 'Proofed Curation Market control plane: stake drops, verify delivery proofs, allocate rewards.'
  x-product-slug: ai-decentralized-veridrop
  x-source: ai-in-decentralized+ai/openminedOcean Protocol Technical Whitepaper/
servers:
- url: https://api.example.com
tags:
- name: Services
  description: AI data and compute services
- name: DropPositions
  description: Curation stake positions
- name: ServiceAgreements
  description: Consumer-provider agreements
- name: DeliveryProofs
  description: Cryptographic delivery attestations
- name: RewardEpochs
  description: Emission epochs and allocations
- name: ArbitrationCases
  description: IP and delivery disputes
paths:
  /v1/services:
    get:
      operationId: listServices
      tags:
      - Services
      summary: List Service
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeService'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: registerService
      tags:
      - Services
      summary: Create Service
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
