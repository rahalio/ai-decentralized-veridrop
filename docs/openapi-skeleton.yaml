components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
    AgreementId:
      name: agreementId
      in: path
      required: true
      schema:
        type: string
    ProofId:
      name: proofId
      in: path
      required: true
      schema:
        type: string
    EpochId:
      name: epochId
      in: path
      required: true
      schema:
        type: string
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Service:
      type: object
      required:
      - id
      - providerParticipantId
      - serviceType
      - proofTypeRequired
      - status
      properties:
        id:
          type: string
        providerParticipantId:
          type: string
        serviceType:
          type: string
          enum:
          - dataAvailability
          - privacyCompute
          - persistence
        proofTypeRequired:
          type: string
          enum:
          - availability
          - zkCompute
          - replication
        status:
          type: string
          enum:
          - active
          - paused
          - retired
        title:
          type: string
    ServiceCreate:
      type: object
      required:
      - providerParticipantId
      - serviceType
      - proofTypeRequired
      - status
      properties:
        providerParticipantId:
          type: string
        serviceType:
          type: string
          enum:
          - dataAvailability
          - privacyCompute
          - persistence
        proofTypeRequired:
          type: string
          enum:
          - availability
          - zkCompute
          - replication
        status:
          type: string
          enum:
          - active
          - paused
          - retired
        title:
          type: string
    DataEnvelopeService:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Service'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeService:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Service'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DropPosition:
      type: object
      required:
      - id
      - serviceId
      - curatorParticipantId
      - dropsAmount
      - status
      properties:
        id:
          type: string
        serviceId:
          type: string
        curatorParticipantId:
          type: string
        dropsAmount:
          type: number
        stakedOcean:
          type: number
        status:
          type: string
          enum:
          - open
          - unstaking
          - closed
    DropPositionCreate:
      type: object
      required:
      - serviceId
      - curatorParticipantId
      - dropsAmount
      - status
      properties:
        serviceId:
          type: string
        curatorParticipantId:
          type: string
        dropsAmount:
          type: number
        stakedOcean:
          type: number
        status:
          type: string
          enum:
          - open
          - unstaking
          - closed
    DataEnvelopeDropPosition:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/DropPosition'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeDropPosition:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DropPosition'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ServiceAgreement:
      type: object
      required:
      - id
      - serviceId
      - consumerParticipantId
      - status
      properties:
        id:
          type: string
        serviceId:
          type: string
        consumerParticipantId:
          type: string
        status:
          type: string
          enum:
          - proposed
          - active
          - fulfilled
          - disputed
          - cancelled
        accessPolicyRef:
          type: string
    ServiceAgreementCreate:
      type: object
      required:
      - serviceId
      - consumerParticipantId
      - status
      properties:
        serviceId:
          type: string
        consumerParticipantId:
          type: string
        status:
          type: string
          enum:
          - proposed
          - active
          - fulfilled
          - disputed
          - cancelled
        accessPolicyRef:
          type: string
    DataEnvelopeServiceAgreement:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ServiceAgreement'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeServiceAgreement:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ServiceAgreement'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DeliveryProof:
      type: object
      required:
      - id
      - serviceId
      - agreementId
      - proofType
      - accepted
      properties:
        id:
          type: string
        serviceId:
          type: string
        agreementId:
          type: string
        proofType:
          type: string
          enum:
          - availability
          - zkCompute
          - replication
        accepted:
          type: boolean
        submittedAt:
          type: string
          format: date-time
        rejectReason:
          type: string
    DeliveryProofCreate:
      type: object
      required:
      - serviceId
      - agreementId
      - proofType
      - proofPayload
      properties:
        serviceId:
          type: string
        agreementId:
          type: string
        proofType:
          type: string
          enum:
          - availability
          - zkCompute
          - replication
        proofPayload:
          type: string
    DataEnvelopeDeliveryProof:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/DeliveryProof'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeDeliveryProof:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DeliveryProof'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RewardEpoch:
      type: object
      required:
      - id
      - periodStart
      - periodEnd
      - status
      - totalEmitted
      properties:
        id:
          type: string
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - open
          - finalizing
          - paid
          - paused
        totalEmitted:
          type: number
    RewardEpochCreate:
      type: object
      required:
      - periodStart
      - periodEnd
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - open
          - finalizing
          - paid
          - paused
        totalEmitted:
          type: number
    DataEnvelopeRewardEpoch:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/RewardEpoch'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeRewardEpoch:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RewardEpoch'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ArbitrationCase:
      type: object
      required:
      - id
      - subjectType
      - subjectId
      - status
      - claim
      properties:
        id:
          type: string
        subjectType:
          type: string
          enum:
          - service
          - agreement
          - provenance
        subjectId:
          type: string
        status:
          type: string
          enum:
          - open
          - resolved
          - dismissed
        claim:
          type: string
        resolution:
          type: string
    ArbitrationCaseCreate:
      type: object
      required:
      - subjectType
      - subjectId
      - claim
      properties:
        subjectType:
          type: string
          enum:
          - service
          - agreement
          - provenance
        subjectId:
